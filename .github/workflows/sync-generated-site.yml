name: Sync generated Woldwynd site

on:
  push:
    branches: [main]
    paths:
      - 'catalogue.mjs'
      - 'app.mjs'
      - 'art.mjs'
      - 'garden-core.mjs'
      - 'render.mjs'
      - 'scripts/build.mjs'
      - 'search-connections.json'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and verify
        run: |
          npm run build
          npm test
          npm run check
      - name: Commit generated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Generated site is already current."
          else
            git commit -m "Build Woldwynd site"
            git push
          fi
